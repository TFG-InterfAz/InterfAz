{% extends "base.html" %}

{% block titulo %}Generated HTML Preview{% endblock %}

{% block content %}
<h2 class="mb-4">HTML</h2>

<iframe
  srcdoc="{{ html_code|escape }}"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
  style="width: 100%; height: 1000px; border: 1px solid #ccc;">
</iframe>

<!-- HTML inyectado como texto -->
<script type="text/template" id="rendered-html">
{{ html_code|safe }}
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const iframe = document.getElementById("render-frame");
    const htmlContent = document.getElementById("rendered-html").textContent;

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(htmlContent);
    doc.close();
  });
</script>

<p class="text-muted mt-3">
  Rendered safely using <code>document.write</code> from a <code>&lt;script type="text/template"&gt;</code> block.
</p>
{% endblock %}
