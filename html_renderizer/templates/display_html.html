{% extends "base.html" %}

{% block titulo %}Generated HTML Preview{% endblock %}

{% block content %}
<h2 class="mb-4">HTML</h2>

<iframe id="generated-frame" style="width: 100%; height: 600px; border: 1px solid #ccc;"></iframe>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const htmlContent = `{{ html_code|safe }}`;  // escapa comillas correctamente
    const iframe = document.getElementById("generated-frame");

    if (iframe && iframe.contentDocument) {
      iframe.contentDocument.open();
      iframe.contentDocument.write(htmlContent);
      iframe.contentDocument.close();
    }
  });
</script>
{% endblock %}
