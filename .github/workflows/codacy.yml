name: Codacy Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "develop" ]
  schedule:
    - cron: '17 20 * * 5'  # Runs every Friday at 20:17 UTC

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read  # for actions/checkout to fetch code
      actions: read   # required for private repositories
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Execute Codacy Analysis CLI and generate a SARIF output with security issues
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v3
        with:
          # Get your project token from your Codacy repository settings
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          max-allowed-issues: 2147483647

      # Save the SARIF report as an artifact for later download
      - name: Save SARIF results
        uses: actions/upload-artifact@v3
        with:
          name: codacy-security-report
          path: results.sarif
